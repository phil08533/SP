<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">The Bloom first-dimension schematic</title>
<desc id="desc">Top-down schematic of a compact alien ecosystem. Entry shelf and return arch lead to Lumen Grove, Crystal Cut, Root Bridge, Mineral Pool, and optional Rare Specimen Nook. The return arch remains easy to find.</desc>
<defs>
  <pattern id="stars" width="86" height="86" patternUnits="userSpaceOnUse"><circle cx="11" cy="18" r="1.2" fill="#a2e9dc" opacity=".3"/><circle cx="57" cy="56" r="1" fill="#ffca83" opacity=".25"/><circle cx="75" cy="9" r=".8" fill="#d9c4ff" opacity=".4"/></pattern>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .heading{font:700 27px system-ui,sans-serif;fill:#f4f1ff;letter-spacing:.5px}
    .sub{font:14px system-ui,sans-serif;fill:#b6bfd9}
    .label{font:700 16px system-ui,sans-serif;fill:#f8f5ff}
    .small{font:12px system-ui,sans-serif;fill:#d4d9f1}
    .tiny{font:11px system-ui,sans-serif;fill:#aeb8d7}
    .path{fill:none;stroke:#70d8c4;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
    .pathinner{fill:none;stroke:#c2ffe8;stroke-width:2;stroke-dasharray:3 12;stroke-linecap:round;opacity:.8}
    .node{stroke:#9bead8;stroke-width:1.6;stroke-opacity:.65}
  </style>
</defs>
<rect width="1000" height="720" rx="20" fill="#11152c"/>
<rect width="1000" height="720" rx="20" fill="url(#stars)"/>
<circle cx="770" cy="210" r="160" fill="#4c3e83" opacity=".14"/>
<circle cx="260" cy="420" r="180" fill="#1a9d91" opacity=".12"/>
<text x="40" y="48" class="heading">THE BLOOM</text>
<text x="40" y="72" class="sub">FIRST DIMENSION · WONDER → CURIOSITY → MILD UNEASE → RETURN</text>
<g transform="translate(930 45)"><path d="M0 30V0M0 0L-7 11M0 0L7 11" stroke="#c2ffe8" stroke-width="2.5" fill="none"/><text x="0" y="-9" text-anchor="middle" class="label">N</text></g>

<!-- navigable path -->
<path class="path" d="M180 360 C250 360 260 300 350 300 S480 340 540 330 S650 250 720 260 S820 340 830 420"/>
<path class="pathinner" d="M180 360 C250 360 260 300 350 300 S480 340 540 330 S650 250 720 260 S820 340 830 420"/>
<path class="path" d="M180 360 C190 445 260 500 350 500 S470 470 540 440 S690 450 830 420" opacity=".55"/>
<path class="pathinner" d="M180 360 C190 445 260 500 350 500 S470 470 540 440 S690 450 830 420"/>

<!-- glowing flora/crystals -->
<g filter="url(#glow)" opacity=".9">
  <path d="M320 235l-18 36 15 0-9 30 27-35-15 0 14-31z" fill="#83f4ce"/>
  <path d="M385 335l-20 42 15 0-10 25 29-40-16 0 14-27z" fill="#c4ff79"/>
  <path d="M665 205l-23 48 18 0-11 35 35-47-19 0 17-36z" fill="#f8c879"/>
  <path d="M700 430l-22 46 16 0-10 29 32-42-18 0 15-33z" fill="#89f1d2"/>
</g>

<g>
  <rect x="75" y="300" width="210" height="115" rx="18" fill="#263858" class="node"/>
  <text x="180" y="335" text-anchor="middle" class="label">ENTRY SHELF</text><text x="180" y="359" text-anchor="middle" class="small">Safe landing / orientation</text><text x="180" y="380" text-anchor="middle" class="small">Return arch stays visible</text><text x="180" y="399" text-anchor="middle" class="tiny">No combat or hazard on arrival</text>

  <rect x="275" y="150" width="205" height="115" rx="18" fill="#22535a" class="node"/>
  <text x="378" y="185" text-anchor="middle" class="label">LUMEN GROVE</text><text x="378" y="209" text-anchor="middle" class="small">Main collection area</text><text x="378" y="230" text-anchor="middle" class="small">3 common Lumen Pods</text><text x="378" y="249" text-anchor="middle" class="tiny">Readable pulsing pickup state</text>

  <rect x="445" y="285" width="205" height="115" rx="18" fill="#34405f" class="node"/>
  <text x="548" y="320" text-anchor="middle" class="label">CRYSTAL CUT</text><text x="548" y="344" text-anchor="middle" class="small">Faceted mineral corridor</text><text x="548" y="365" text-anchor="middle" class="small">Slow resonance wave</text><text x="548" y="384" text-anchor="middle" class="tiny">Wait or use the alternate route</text>

  <rect x="620" y="145" width="205" height="115" rx="18" fill="#3a345f" class="node"/>
  <text x="723" y="180" text-anchor="middle" class="label">RARE SPECIMEN NOOK</text><text x="723" y="204" text-anchor="middle" class="small">Optional high-value pickup</text><text x="723" y="225" text-anchor="middle" class="small">Clear hazard warning</text><text x="723" y="244" text-anchor="middle" class="tiny">Never required for mission</text>

  <rect x="245" y="445" width="210" height="110" rx="18" fill="#1e4b53" class="node"/>
  <text x="350" y="480" text-anchor="middle" class="label">ROOT BRIDGE</text><text x="350" y="504" text-anchor="middle" class="small">Strong silhouette / crossing</text><text x="350" y="525" text-anchor="middle" class="tiny">Alternate return route</text>

  <rect x="470" y="440" width="205" height="110" rx="18" fill="#38324f" class="node"/>
  <text x="573" y="475" text-anchor="middle" class="label">MINERAL POOL</text><text x="573" y="499" text-anchor="middle" class="small">Optional resource / hazard</text><text x="573" y="520" text-anchor="middle" class="tiny">Audio + visual telegraph</text>

  <rect x="730" y="385" width="205" height="110" rx="18" fill="#655039" stroke="#ffc77d" stroke-width="2"/>
  <text x="833" y="420" text-anchor="middle" class="label">RETURN ARCH</text><text x="833" y="444" text-anchor="middle" class="small">Amber edge light</text><text x="833" y="465" text-anchor="middle" class="small">Always available</text>
</g>

<rect x="40" y="610" width="920" height="68" rx="14" fill="#1c2440" stroke="#3b4d6d"/>
<circle cx="68" cy="638" r="7" fill="#8ff4d4"/><text x="86" y="643" class="small">Main route</text>
<circle cx="230" cy="638" r="7" fill="#ffc77d"/><text x="248" y="643" class="small">Return landmark</text>
<circle cx="425" cy="638" r="7" fill="#c6a7ff"/><text x="443" y="643" class="small">Optional risk/reward</text>
<text x="65" y="665" class="tiny">Hazards telegraph before activating. No frame-perfect timing, forced stranding, or mandatory rare pickups.</text>
</svg>